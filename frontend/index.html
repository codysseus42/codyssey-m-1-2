<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>여름이었다 — 서울 불쾌지수 AI 비서</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <section id="intro" class="intro">
    <h1>여름이었다</h1>
    <p class="sub">서울 월별 불쾌지수(1961~) 데이터를 아는 AI 비서</p>
    <!-- TODO: 소개 문구 -->
    <p class="intro-body"></p>
    <button id="start" type="button" class="btn">시작하기</button>
  </section>

  <div id="app" hidden>
  <header class="top">
    <div>
      <h1>여름이었다</h1>
      <p class="sub">서울 월별 불쾌지수(1961~) 데이터를 아는 AI 비서</p>
    </div>
  </header>

  <div id="notice" class="notice" hidden></div>

  <section id="summary" class="summary" aria-label="데이터 요약">
    <p class="muted">요약을 불러오는 중…</p>
  </section>

  <main class="layout">
    <aside class="panel history" aria-label="대화 기록">
      <div class="panel-head">
        <h2>대화 기록</h2>
        <button id="new-chat" type="button" class="btn small">새 대화</button>
      </div>
      <ul id="history-list" class="list"></ul>
    </aside>

    <section class="panel chat" aria-label="채팅">
      <div class="panel-head">
        <h2>AI 채팅</h2>
        <span id="chat-status" class="muted small"></span>
      </div>
      <div id="messages" class="messages" aria-live="polite">
        <p class="muted hint">예: “요즘 여름이 예전보다 더 습해진 게 맞아?”, “불쾌지수가 가장 높았던 달은?”</p>
      </div>
      <form id="chat-form" class="chat-form">
        <textarea id="chat-input" rows="2" maxlength="2000" placeholder="데이터에 대해 물어보세요 (Enter 전송, Shift+Enter 줄바꿈)"></textarea>
        <button id="chat-send" type="submit" class="btn">전송</button>
      </form>
    </section>

    <section class="panel data" aria-label="데이터 관리">
      <div class="panel-head">
        <h2>데이터 관리</h2>
        <span id="data-count" class="muted small"></span>
      </div>
      <form id="data-form" class="data-form">
        <label>월 <input id="f-date" type="month" placeholder="YYYY-MM" pattern="\d{4}-\d{2}" required /></label>
        <label>불쾌지수 <input id="f-value" type="number" step="0.01" required /></label>
        <label class="wide">메모 <input id="f-memo" type="text" maxlength="500" placeholder="선택" /></label>
        <div class="form-actions">
          <button id="f-submit" type="submit" class="btn">추가</button>
          <button id="f-cancel" type="button" class="btn ghost" hidden>취소</button>
        </div>
        <p id="data-msg" class="small" role="status"></p>
      </form>
      <div class="table-wrap">
        <table>
          <thead><tr><th>날짜</th><th>값</th><th>메모</th><th></th></tr></thead>
          <tbody id="data-rows"></tbody>
        </table>
      </div>
    </section>
  </main>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
